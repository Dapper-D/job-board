# B3spoken daily shared scan (step 2): builds the Canada job pool and publishes it on the "job-pool" pre-release.
# The scan job has read-only access; only the small publish job can write, and it only uploads the built files.
# Runs every day from main (schedules only run from the default branch), on pushes to main that change the scan, and by hand.
name: B3spoken daily job pool
on:
  schedule:
    # 04:17 UTC (8:17 pm Pacific the evening before). GitHub often starts scheduled runs hours late; at the old
    # 10:23 UTC slot runs began around 16:30-17:30 UTC, after the 6 am Pacific board refreshes that read this pool.
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['b3spoken/src/scan/daily.mjs', 'b3spoken/src/scan/verify.mjs', 'b3spoken/src/scan/describe.mjs', '.github/workflows/b3spoken-daily.yml']
permissions:
  contents: read
concurrency:
  group: b3spoken-daily
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: b3spoken
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: node src/scan/daily.mjs --employers catalog/employers.json --out out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: job-pool
          path: |
            b3spoken/out/pool.json.gz
            b3spoken/out/pool-meta.json
            b3spoken/out/report.json
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: job-pool
          path: pool
      - name: Publish to the job-pool pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release view job-pool -R "$REPO" >/dev/null 2>&1 || gh release create job-pool -R "$REPO" --prerelease --target main \
            --title "B3spoken job pool (testing)" \
            --notes "Daily Canada job pool for B3spoken helpers, rebuilt every morning. Job-site listings stay under their sites' terms (see b3spoken/SOURCES.md) and may not be passed on to other job boards or aggregators."
          gh release upload job-pool -R "$REPO" --clobber pool/pool.json.gz pool/pool-meta.json pool/report.json
