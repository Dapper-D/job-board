# Publishes a B3spoken pre-release when a maintainer pushes a tag like b3spoken-v0.1.0.
# 1. build (Windows, no secrets): builds and tests the installer, exactly like the Windows build workflow.
# 2. publish (the "release" environment): needs a maintainer's approval; signs SHA256SUMS with the release key
#    and creates a GitHub pre-release with the installer, SHA256SUMS and SHA256SUMS.sig.
# The release environment must allow b3spoken-v* tags (Settings -> Environments -> release -> deployment tags).
name: B3spoken release
on:
  push:
    tags: ['b3spoken-v*']
permissions:
  contents: read
concurrency:
  group: b3spoken-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: b3spoken
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Check the tag matches the version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "b3spoken-v$v" ]; then echo "::error::Tag $TAG doesn't match b3spoken/package.json version $v"; exit 1; fi
      - run: npm test
      - name: Make sure Inno Setup is there
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) { choco install innosetup -y --no-progress }
      - run: node scripts/build-exe.mjs
      - name: Install, test, uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\B3spoken-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          node scripts/exe-smoke.mjs "$env:LOCALAPPDATA\Programs\B3spoken\B3spoken.exe"
          if ($LASTEXITCODE -ne 0) { throw 'smoke test failed' }
          Start-Process "$env:LOCALAPPDATA\Programs\B3spoken\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: b3spoken/dist/B3spoken-Setup-*.exe
          retention-days: 7
  build-mac-linux:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: b3spoken
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/build-exe.mjs
      - name: Test the app
        run: node scripts/exe-smoke.mjs "$PWD/dist/$([ "$RUNNER_OS" = macOS ] && echo B3spoken || echo b3spoken)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ runner.os }}
          path: |
            b3spoken/dist/B3spoken-mac-*.zip
            b3spoken/dist/B3spoken-linux-*.tar.gz
          retention-days: 7
  publish:
    needs: [build, build-mac-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: b3spoken/dist
          merge-multiple: true
      - name: Source package (for people who install from source with setup.ps1 / setup.sh)
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: git archive --format=tar.gz -o "b3spoken/dist/B3spoken-source-${TAG#b3spoken-v}.tar.gz" HEAD b3spoken setup.ps1 setup.sh uninstall.ps1 uninstall.sh README.md HANDOFF.md LICENSE SECURITY.md
      - name: Sign
        working-directory: b3spoken
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then echo "::error::The release environment has no RELEASE_SIGNING_KEY secret"; exit 1; fi
          umask 077
          keyfile="$RUNNER_TEMP/release-signing-key.pem"
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$keyfile"
          B3SPOKEN_RELEASE_KEY="$keyfile" node scripts/sign-release.mjs dist/B3spoken-Setup-*.exe dist/B3spoken-mac-*.zip dist/B3spoken-linux-*.tar.gz dist/B3spoken-source-*.tar.gz | tee "$RUNNER_TEMP/sign.txt"
          rm -f "$keyfile"
          node scripts/sign-release.mjs --verify dist
      - name: Publish the pre-release
        working-directory: b3spoken
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          fp="$(grep -o 'Release key fingerprint: .*' "$RUNNER_TEMP/sign.txt" | head -1)"
          notes="B3spoken preview for testers. Windows: download B3spoken-Setup and run it. Mac (Apple silicon): download the mac zip, open it, then right-click B3spoken and choose Open. Linux: unpack the linux tar.gz and run ./b3spoken. Prefer to see every file? Download B3spoken-source, unpack it and run setup.ps1 (Windows) or bash setup.sh (Mac, Linux). B3spoken opens in your browser.
          Windows may warn that the app is from an unknown publisher (it isn't code-signed yet): choose More info, then Run anyway.
          To check the download: SHA256SUMS lists the installer's SHA-256 and SHA256SUMS.sig is signed with the release key.

          $fp"
          gh release create "$TAG" dist/B3spoken-Setup-*.exe dist/B3spoken-mac-*.zip dist/B3spoken-linux-*.tar.gz dist/B3spoken-source-*.tar.gz dist/SHA256SUMS dist/SHA256SUMS.sig --prerelease --title "B3spoken ${TAG#b3spoken-v} (preview)" --notes "$notes" --target "$GITHUB_SHA"
