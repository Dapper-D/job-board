name: B3spoken SuccessFactors sample
on:
  push:
    branches: [b3spoken]
    paths: ['b3spoken/scripts/sf-sample.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22 }
      - run: node b3spoken/scripts/sf-sample.mjs jobs.scotiabank.com careers.ey.com careers.sap.com jobs.aecon.com careers.celestica.com jobs.hatch.com
